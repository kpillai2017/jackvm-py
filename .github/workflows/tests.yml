# GitHub Actions: run the test suite automatically on every push and pull
# request. Results appear in the "Actions" tab of the repository on GitHub.
#
# No real screen is needed: tests/conftest.py tells pygame to use SDL's
# "dummy" video and audio drivers.

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # let every combination finish, even if one fails
      matrix:
        os: [ubuntu-latest]
        # The oldest supported Python, a middle one, and the newest tested one.
        python-version: ["3.9", "3.11", "3.13"]
        include:
          # Also check the other desktop systems people will play on.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Install the package itself too, so its "jack_tools" entry point
          # (how jack-compiler finds this VM) is registered and tested.
          python -m pip install -e .

      - name: Fetch jack-compiler (to check the shared integrations.py matches)
        shell: bash
        run: |
          # The branch with the same name as this one, if jack-compiler has it; else main.
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          dest="$RUNNER_TEMP/jack-compiler"
          git clone --quiet --depth 1 --branch "$branch" https://github.com/kpillai2017/jack-compiler.git "$dest" 2>/dev/null \
            || git clone --quiet --depth 1 https://github.com/kpillai2017/jack-compiler.git "$dest"
          echo "JACK_TOOLS_COMPANION=$dest" >> "$GITHUB_ENV"
          echo "Comparing with jack-compiler @ $(git -C "$dest" rev-parse --abbrev-ref HEAD) $(git -C "$dest" rev-parse --short HEAD)"

      - name: Fetch and install jack-decompiler (for Ctrl+U's tests with the real decompiler)
        shell: bash
        run: |
          # The branch with the same name as this one, if jack-decompiler has it; else main.
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          dest="$RUNNER_TEMP/jack-decompiler"
          git clone --quiet --depth 1 --branch "$branch" https://github.com/kpillai2017/jack-decompiler.git "$dest" 2>/dev/null \
            || git clone --quiet --depth 1 https://github.com/kpillai2017/jack-decompiler.git "$dest"
          # Installed like a user would, so jackvm finds it through its "jack_tools" entry point.
          python -m pip install -e "$dest"
          echo "JACK_DECOMPILER_CHECKOUT=$dest" >> "$GITHUB_ENV"
          echo "Testing with jack-decompiler @ $(git -C "$dest" rev-parse --abbrev-ref HEAD) $(git -C "$dest" rev-parse --short HEAD)"

      - name: Run the tests
        run: python -m pytest -v

      - name: Smoke-test the command line (headless)
        run: python -m jackvm hello-world --headless --ticks 200000
