# config.example.ini - a template for the jack-tools config file
# ================================================================
#
# jack-compiler (jackc, jackc-gui) and jackvm-py (jackvm) read this file to
# find each other, from any folder and any Python environment. It's the same
# in both repositories.
#
# Where it goes:
#   macOS / Linux:  ~/.config/jack-tools/config.ini   ($XDG_CONFIG_HOME is honoured)
#   Windows:        %APPDATA%\jack-tools\config.ini
#   Anywhere else:  set JACK_TOOLS_CONFIG=/path/to/file.ini
#
# To use it, copy it there and remove the ";" in front of the lines you want:
#   mkdir -p ~/.config/jack-tools
#   cp config.example.ini ~/.config/jack-tools/config.ini
#
# You don't have to write it by hand: when one app can't find the other,
# press Ctrl+J in its window, choose the folder, and the line is added for you.
#
# Each value is either:
#   * a FOLDER - usually the repository you cloned. The command is looked
#     for in the folder, its bin/, and a virtual environment inside it
#     (.venv, venv, env, .direnv/*). If that environment only has the
#     requirements (pip install -r requirements.txt), the app is run from
#     its source with that environment's Python.
#   * a COMMAND - the full path of the program, with arguments if needed.
#     Put a path with spaces in double quotes.
#   * off - don't look for this app at all (its shortcut says "not installed").
#
# ~ means your home folder. Lines starting with ";" or "#" are comments, and
# a comment can also end a line after a space.
#
# The lookup order is: environment variable (JACKVM, JACKC, JACKC_GUI) ->
# this file -> the same Python environment -> the PATH. So an environment
# variable always beats this file.

[apps]

# JackVM, for jackc-gui's Ctrl+J ("run in JackVM"):
; jackvm = ~/code/jackvm-py
; jackvm = ~/code/jackvm-py/.venv/bin/jackvm
; jackvm = "C:\Users\me\code\jackvm-py\.venv\Scripts\jackvm.exe"
; jackvm = off

# The Jack compiler, for running .jack source in jackvm. jackc-gui (for
# jackvm's Ctrl+J, "open in compiler") is found in the same folder, so this
# one line is usually all you need for jack-compiler:
; jackc = ~/code/jack-compiler
; jackc = /opt/jack/bin/jackc
; jackc = off

# Only if jackc-gui lives somewhere other than jackc:
; jackc-gui = ~/code/jack-compiler/.venv/bin/jackc-gui
