# Project settings.
#
# You don't need to "install" this project to use it - running
# `python -m jackvm ...` from this folder works. This file only:
#   * describes the project (name, version, dependencies), and
#   * tells pytest where to find the code and the tests.
#
# Optional: `pip install -e .` installs a `jackvm` command you can run from
# any folder (e.g. `jackvm pong`).

[project]
name = "jackvm-py"
version = "0.1.0"
description = "A beginner-friendly Python port of jackvm-rs: a nand2tetris Jack VM with a pygame player and memory debugger."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pygame>=2.6.1"]
# MIT, like the original jackvm-rs. LICENSE keeps Jim Connell's copyright notice.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["nand2tetris", "jack", "virtual machine", "emulator", "pygame", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: System :: Emulators",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/kpillai2017/jackvm-py"
"Repository" = "https://github.com/kpillai2017/jackvm-py.git"
"Issues" = "https://github.com/kpillai2017/jackvm-py/issues"
# The Rust/WebAssembly project this is a port of.
"Original (jackvm-rs)" = "https://github.com/jcon/jackvm-rs"
"nand2tetris" = "https://www.nand2tetris.org"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jackvm = "jackvm.main:main"

# Lets jack-compiler (https://github.com/kpillai2017/jack-compiler) find this VM
# when both are installed in the same Python environment, so its window can
# run programs here (Ctrl+J). See jackvm/integrations.py.
[project.entry-points.jack_tools]
vm = "jackvm.main:main"

[build-system]
requires = ["setuptools>=77"]  # 77+ understands `license = "MIT"`
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jackvm"]

[tool.setuptools.package-data]
jackvm = ["os/*.vm"]

[tool.pytest.ini_options]
# Let the tests `import jackvm` without installing anything first.
pythonpath = ["."]
testpaths = ["tests"]
